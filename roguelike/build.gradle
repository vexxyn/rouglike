plugins {
    id 'java'
    id 'application'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

repositories { mavenCentral() }

ext { gdxVersion = '1.12.1' }

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// folder assets/ ikut masuk classpath (dan ke dalam JAR), jadi Gdx.files.internal("data/...") ketemu
sourceSets.main.resources.srcDirs += ['assets']

application {
    mainClass = 'com.example.roguelike.DesktopLauncher'
}

tasks.named('run') {
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'   // wajib untuk LWJGL3 di macOS
    }
}

tasks.named('test') { useJUnitPlatform() }

// ./gradlew jar -> build/libs/roguelike-all.jar (fat jar, bisa langsung `java -jar`)
tasks.register('dist', Jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': application.mainClass }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}
